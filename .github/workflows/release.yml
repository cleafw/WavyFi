name: Release

# Pushing a tag like v1.2.3 builds the release assets and creates a DRAFT
# GitHub release carrying them — review the generated notes, then publish.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, such as v1.1.0
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.403

      - name: Check release version
        run: |
          $project = [xml](Get-Content src/WavyFi/WavyFi.csproj -Raw)
          $version = $project.Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match project version $version."
          }

      - name: Test
        run: dotnet test

      - name: Publish
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')

          foreach ($rid in 'win-x64', 'win-arm64') {
            # Self-contained single-file exe: download and run, no runtime
            # install needed.
            dotnet publish src/WavyFi -c Release -r $rid --self-contained `
              -p:PublishSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true `
              -p:DebugType=none -p:Version=$version -o "out/$rid"
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Compress-Archive -Path "out/$rid/WavyFi.exe", 'LICENSE', 'README.md', 'README.en.md' `
              -DestinationPath "WavyFi-$version-$rid.zip"

            # Small variant for users who already have the .NET Desktop
            # Runtime. (No EnableCompressionInSingleFile here: the SDK only
            # supports it for self-contained publishes — NETSDK1176.)
            dotnet publish src/WavyFi -c Release -r $rid --self-contained false `
              -p:PublishSingleFile=true -p:DebugType=none -p:Version=$version `
              -o "out/$rid-fdd"
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Compress-Archive -Path "out/$rid-fdd/WavyFi.exe", 'LICENSE', 'README.md', 'README.en.md' `
              -DestinationPath "WavyFi-$version-$rid-framework-dependent.zip"
          }

      - name: Generate SHA-256 checksums
        run: |
          Get-ChildItem 'WavyFi-*.zip' | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Path SHA256SUMS.txt -Encoding ascii

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG (Get-ChildItem 'WavyFi-*.zip').FullName SHA256SUMS.txt `
            --draft --verify-tag --notes-file "docs/releases/$env:RELEASE_TAG.md" `
            --title "WavyFi $env:RELEASE_TAG"
